services:
  - type: web
    name: ai-government-scheme-finder
    env: python
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt"
    startCommand: "python backend/app.py"
    envVars:
      - key: PORT
        value: 5000
      - key: FLASK_DEBUG
        value: False
